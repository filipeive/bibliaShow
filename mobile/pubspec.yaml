name: biblia_show
description: "Bíblia Show 2.0 — O clássico jogo de perguntas e respostas bíblicas estilo Show do Milhão com modo offline e arena multiplayer."
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  sqflite: ^2.3.0
  path: ^1.8.3
  shared_preferences: ^2.2.2
  audioplayers: ^5.2.1
  vibration: ^2.0.1
  http: ^1.1.0
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/questoes.json
    - assets/audio/
